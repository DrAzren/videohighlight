<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>KPT Reel Overlay</title>
<!--
  Motion-graphics layer for the KPT mental-health reel (1080x1920, 30 fps, 30 s).
  HyperFrames-style composition: every element is a pure function of time, driven by
  window.seek(t), so each frame renders deterministically and can be captured with a
  transparent background and composited over the footage.
  Assets are resolved relative to window.ASSETS (default "assets/").
-->
<style>
@font-face{font-family:'Anton';src:url(FONTS/Anton-400.woff2) format('woff2');}
@font-face{font-family:'Bebas Neue';src:url(FONTS/BebasNeue-400.woff2) format('woff2');}
@font-face{font-family:'Caveat';font-weight:700;src:url(FONTS/Caveat-700.woff2) format('woff2');}
@font-face{font-family:'Montserrat';font-weight:600 900;src:url(FONTS/Montserrat-800.woff2) format('woff2');}
@font-face{font-family:'Playfair Display';font-weight:700;src:url(FONTS/PlayfairDisplay-700.woff2) format('woff2');}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:600;src:url(FONTS/PlayfairDisplay-600i.woff2) format('woff2');}
:root{
  --navy:#0B1F4D; --navy2:#16357A; --gold:#E9B949; --gold2:#F7D98B;
  --cream:#F7F1E3; --coral:#FF6B5B; --teal:#2EC4B6; --sky:#7CC8FF; --pink:#FF9EC4;
}
html,body{margin:0;padding:0;background:transparent;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%;}
.anton{font-family:'Anton',sans-serif;line-height:1;}
.bebas{font-family:'Bebas Neue',sans-serif;line-height:1;}
.mont{font-family:'Montserrat',sans-serif;font-weight:800;line-height:1.05;}
.play{font-family:'Playfair Display',serif;line-height:1.05;}
.cav{font-family:'Caveat',cursive;font-weight:700;line-height:1;}
.ltr{display:inline-block;white-space:pre;}
.anton,.bebas,.mont,.play,.cav{white-space:nowrap;}
.sticker{filter:drop-shadow(0 10px 14px rgba(5,12,35,.45));}
.full{width:1080px;height:1920px;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const W = 1080, H = 1920;
const A = (window.ASSETS || 'assets/');
const stage = document.getElementById('stage');

// ---------- helpers --------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const oc = x => 1 - Math.pow(1 - x, 3);
const oq = x => 1 - Math.pow(1 - x, 5);
const ic = x => x * x * x;
const ioc = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const ob = (x, s = 1.9) => { const c = s + 1; return 1 + c * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const oe = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * 2 * Math.PI / 3) + 1;
// opacity window: fade in over fi from a, fade out over fo ending at b
const win = (t, a, b, fi = .15, fo = .15) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

function el(tag, cls, css, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  if (html !== undefined) e.innerHTML = html;
  (parent || stage).appendChild(e);
  return e;
}
function svg(w, h, inner, css, parent) {
  return el('div', 'abs', `width:${w}px;height:${h}px;${css || ''}`, parent,
    `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">${inner}</svg>`);
}
function letters(parent, text, css) {
  return [...text].map(ch => el('span', 'ltr', css || '', parent, ch === ' ' ? '&nbsp;' : ch));
}
function show(e, on) { e.style.display = on ? '' : 'none'; return on; }
function tf(e, x, y, s = 1, r = 0, extra = '') {
  e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})${extra}`;
}

// torn edge: jagged polyline points across [x0,x1] around y(x)
function tornPts(x0, x1, yf, amp, seed, step = 18) {
  const r = rng(seed), pts = [];
  for (let x = x0; x <= x1 + step; x += step) pts.push([Math.min(x, x1), yf(Math.min(x, x1)) + (r() - .5) * 2 * amp]);
  return pts;
}
const P = pts => pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

// paper texture (deterministic noise) as data URL
function paperTex(base, seed, alpha = .07) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  const r = rng(seed), d = g.getImageData(0, 0, 256, 256);
  for (let i = 0; i < d.data.length; i += 4) {
    const n = (r() - .5) * 255 * alpha * 2;
    d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n;
  }
  g.putImageData(d, 0, 0);
  for (let k = 0; k < 40; k++) { // fibres
    g.strokeStyle = `rgba(255,255,255,${.04 + r() * .05})`; g.lineWidth = 1;
    g.beginPath(); const x = r() * 256, y = r() * 256; g.moveTo(x, y);
    g.quadraticCurveTo(x + r() * 30 - 15, y + r() * 30 - 15, x + r() * 50 - 25, y + r() * 50 - 25); g.stroke();
  }
  return c.toDataURL();
}

// torn-paper label (div with clip-path polygon)
function tornClip(w, h, amp, seed) {
  const r = rng(seed), pts = [];
  const n = 14;
  for (let i = 0; i <= n; i++) pts.push([i / n * w, (r()) * amp]);
  for (let i = 0; i <= 6; i++) pts.push([w - r() * amp * .6, i / 6 * h]);
  for (let i = n; i >= 0; i--) pts.push([i / n * w, h - r() * amp]);
  for (let i = 6; i >= 0; i--) pts.push([r() * amp * .6, i / 6 * h]);
  return 'polygon(' + pts.map(p => `${(p[0] / w * 100).toFixed(2)}% ${(p[1] / h * 100).toFixed(2)}%`).join(',') + ')';
}

// ---------- icon library (sticker style: white outline under navy-stroked art) -------
const ICONS = {
  heart: `<path d="M50 88 C18 62 4 46 4 28 C4 13 16 4 29 4 C39 4 46 10 50 18 C54 10 61 4 71 4 C84 4 96 13 96 28 C96 46 82 62 50 88Z" fill="#FF6B5B"/>`,
  bubble: `<path d="M10 8 H90 Q98 8 98 16 V60 Q98 68 90 68 H44 L24 90 L28 68 H10 Q2 68 2 60 V16 Q2 8 10 8Z" fill="#7CC8FF"/>
           <circle cx="30" cy="38" r="7" fill="#0B1F4D"/><circle cx="50" cy="38" r="7" fill="#0B1F4D"/><circle cx="70" cy="38" r="7" fill="#0B1F4D"/>`,
  brain: `<path d="M50 14 C42 4 24 6 20 18 C8 20 4 34 10 42 C2 50 6 66 18 68 C20 82 36 88 46 80 L50 78 L54 80 C64 88 80 82 82 68 C94 66 98 50 90 42 C96 34 92 20 80 18 C76 6 58 4 50 14Z" fill="#FF9EC4"/>
          <path d="M50 16 V78 M30 30 Q40 36 34 46 M70 30 Q60 36 66 46 M26 56 Q36 54 40 62 M74 56 Q64 54 60 62" fill="none" stroke="#0B1F4D" stroke-width="4" stroke-linecap="round"/>`,
  smile: `<circle cx="50" cy="50" r="44" fill="#E9B949"/><circle cx="35" cy="40" r="6" fill="#0B1F4D"/><circle cx="65" cy="40" r="6" fill="#0B1F4D"/>
          <path d="M28 58 Q50 80 72 58" fill="none" stroke="#0B1F4D" stroke-width="6" stroke-linecap="round"/>`,
  sprout: `<path d="M50 92 V50" stroke="#0B1F4D" stroke-width="6" fill="none"/><path d="M50 56 C30 58 14 44 14 22 C36 22 50 34 50 56Z" fill="#2EC4B6"/>
           <path d="M50 46 C66 46 84 34 86 12 C64 12 50 26 50 46Z" fill="#7FE0C0"/>`,
  star: `<path d="M50 4 L61 37 L96 38 L68 59 L78 94 L50 73 L22 94 L32 59 L4 38 L39 37Z" fill="#F7D98B"/>`,
  hands: `<path d="M8 70 Q20 54 36 58 L56 64 Q62 66 60 72 Q58 77 52 76 L40 74 M8 70 L8 92 L60 92 Q72 92 82 82 L96 66 Q98 58 90 58 Q84 58 78 64 L66 74" fill="#F7F1E3"/>
          <path d="M50 46 C36 36 30 30 30 22 C30 14 36 10 42 10 C46 10 49 13 50 16 C51 13 54 10 58 10 C64 10 70 14 70 22 C70 30 64 36 50 46Z" fill="#FF6B5B"/>`,
};
function icon(name, size) {
  const art = ICONS[name];
  const outline = art.replace(/fill="[^"]*"/g, 'fill="#fff"').replace(/stroke="#0B1F4D"/g, 'stroke="#fff"');
  return `<svg width="${size}" height="${size}" viewBox="-6 -6 112 112" style="overflow:visible">
    <g stroke="#fff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">${outline}</g>
    <g stroke="#0B1F4D" stroke-width="3.5" stroke-linejoin="round">${art}</g></svg>`;
}

// hand-drawn doodles: stroked paths, revealed with stroke-dashoffset
const DOODLES = {
  star: 'M50 6 L60 38 L94 38 L66 58 L77 92 L50 71 L23 92 L34 58 L6 38 L40 38Z',
  burst: 'M50 2 V22 M50 78 V98 M2 50 H22 M78 50 H98 M16 16 L30 30 M70 70 L84 84 M84 16 L70 30 M30 70 L16 84',
  squiggle: 'M2 50 Q14 20 26 50 T50 50 T74 50 T98 50',
  heart: 'M50 88 C18 62 4 46 4 28 C4 13 16 4 29 4 C39 4 46 10 50 18 C54 10 61 4 71 4 C84 4 96 13 96 28 C96 46 82 62 50 88Z',
  arrow: 'M6 80 Q40 10 86 30 M70 14 L88 30 L68 44',
  spark: 'M50 10 V36 M50 64 V90 M10 50 H36 M64 50 H90',
  loop: 'M8 60 C20 10 60 10 50 50 C40 90 80 90 92 40',
  bubble: 'M14 10 H86 Q94 10 94 18 V58 Q94 66 86 66 H46 L26 88 L30 66 H14 Q6 66 6 58 V18 Q6 10 14 10Z',
};
function doodle(name, size, color, css, sw = 6) {
  const d = svg(size, size, `<g transform="scale(${size / 100})"><path d="${DOODLES[name]}" pathLength="1" fill="none"
      stroke="${color}" stroke-width="${sw * 100 / size}" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="1 1" stroke-dashoffset="1"/></g>`, css);
  d.path = d.querySelector('path');
  return d;
}

const C = []; // timeline updaters
const on = f => C.push(f);

// ============================================================================
// 0. reusable transition FX
// ============================================================================
// whip streaks on whip cuts
const streakLayer = el('div', 'abs full', 'pointer-events:none');
const STREAK_T = [1.5, 5.0, 11.0, 14.0, 18.0, 21.5];
const streaks = [];
{
  const r = rng(7);
  for (let i = 0; i < 9; i++) {
    const s = el('div', 'abs', `height:${4 + r() * 10}px;width:${300 + r() * 700}px;border-radius:8px;
      background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(247,217,139,0));`, streakLayer);
    streaks.push({ s, y: 150 + r() * 1600, d: r() * .05, sp: .8 + r() * .5 });
  }
}
on(t => {
  let k = -1;
  for (const c of STREAK_T) if (t >= c - .12 && t <= c + .14) k = c;
  if (!show(streakLayer, k >= 0)) return;
  streaks.forEach((o, i) => {
    const p = prog(t, k - .12 + o.d, k + .1 + o.d);
    const dir = (i % 2 ? 1 : -1) * (k === 14.0 ? -1 : 1);
    const x = dir > 0 ? lerp(-1100, 1300, ic(p) * o.sp) : lerp(1300, -1100, ic(p) * o.sp);
    tf(o.s, x, o.y);
    o.s.style.opacity = p > 0 && p < 1 ? .85 : 0;
  });
});

// white flashes (camera shutter / impact)
const flash = el('div', 'abs full', 'background:#fff;opacity:0');
const FLASH = [[0.0, .9, .16], [7.0, .75, .1], [16.0, .8, .12], [27.0, .4, .3], [21.0, .7, .14], [24.0, .55, .4], [22.55, .35, .08], [22.8, .35, .08], [23.05, .35, .08]];
on(t => {
  let o = 0;
  for (const [c, a, d] of FLASH) if (t >= c && t < c + d) o = Math.max(o, a * (1 - (t - c) / d));
  flash.style.opacity = o;
  show(flash, o > 0.001);
});

// paper rip transition: paper covers the outgoing shot, then tears apart on the cut
function rip(tc, base, seed, tape) {
  const tex = paperTex(base, seed);
  const r = rng(seed);
  const yL = 820 + r() * 120, yR = 1000 + r() * 120;
  const edge = tornPts(-40, W + 40, x => lerp(yL, yR, (x + 40) / (W + 80)), 22, seed + 1, 22);
  const topPoly = [[-40, -60], [W + 40, -60], ...edge.slice().reverse()];
  const botPoly = [...edge, [W + 40, H + 60], [-40, H + 60]];
  const mk = (poly, withTape) => svg(W, H, `<defs><pattern id="pp${seed}${poly.length}" width="256" height="256" patternUnits="userSpaceOnUse">
      <image href="${tex}" width="256" height="256"/></pattern></defs>
      <polygon points="${P(poly)}" fill="url(#pp${seed}${poly.length})"/>
      <polyline points="${P(edge)}" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round" opacity=".92"/>
      ${tape && withTape ? `<rect x="380" y="${(yL + yR) / 2 - 300}" width="320" height="80" fill="${tape}" opacity=".85" transform="rotate(-6 540 ${(yL + yR) / 2 - 260})"/>` : ''}`,
    'filter:drop-shadow(0 0 18px rgba(0,0,0,.45))');
  const top = mk(topPoly, true), bot = mk(botPoly, false);
  on(t => {
    const vis = t >= tc - .17 && t <= tc + .36;
    show(top, vis); show(bot, vis);
    if (!vis) return;
    if (t < tc) {
      const k = ic(prog(t, tc - .17, tc));
      tf(top, 0, lerp(-1150, 0, k)); tf(bot, 0, lerp(1150, 0, k));
    } else {
      const q = prog(t, tc, tc + .34), k = q * q * (1.6 - .6 * q);
      tf(top, lerp(0, -120, k), lerp(0, -1350, k), 1, lerp(0, -9, k));
      tf(bot, lerp(0, 120, k), lerp(0, 1350, k), 1, lerp(0, 7, k));
    }
  });
}

// iris (circular) transition
function iris(tc, color) {
  const c = el('div', 'abs', `border-radius:50%;box-shadow:0 0 0 2600px ${color};border:16px solid var(--gold);box-sizing:border-box`);
  on(t => {
    if (!show(c, t >= tc - .18 && t <= tc + .26)) return;
    const rr = t < tc ? lerp(1250, 0, ic(prog(t, tc - .18, tc))) : lerp(0, 1250, oc(prog(t, tc, tc + .26)));
    c.style.width = c.style.height = (2 * rr) + 'px';
    tf(c, 540 - rr, 980 - rr);
    c.style.borderWidth = rr < 10 ? '0px' : '16px';
  });
}

// ============================================================================
// 1. HOOK 0-3  "MENTAL HEALTH @ KPT!" + "15 OKTOBER 2026"
// ============================================================================
{
  // radial burst + paper confetti from the centre
  const burst = el('div', 'abs full');
  const r = rng(21);
  const rays = [];
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * 360 + r() * 8;
    const ray = el('div', 'abs', `width:${360 + r() * 260}px;height:${10 + r() * 14}px;border-radius:10px;
      background:${i % 3 ? 'var(--gold2)' : '#fff'};transform-origin:0 50%`, burst);
    rays.push({ ray, a });
  }
  const conf = [];
  const cols = ['#E9B949', '#FF6B5B', '#7CC8FF', '#2EC4B6', '#ffffff', '#FF9EC4'];
  for (let i = 0; i < 46; i++) {
    const kind = i % 3;
    const s = 14 + r() * 26;
    const e = el('div', 'abs', `width:${s}px;height:${kind === 2 ? s * .45 : s}px;background:${cols[i % cols.length]};
      border-radius:${kind === 0 ? '50%' : '3px'};box-shadow:0 3px 6px rgba(0,0,0,.25)`, burst);
    conf.push({ e, a: r() * Math.PI * 2, v: 700 + r() * 1100, rot: r() * 720 - 360, d: r() * .08 });
  }
  const cx = 540, cy = 1130;
  on(t => {
    if (!show(burst, t < 1.6)) return;
    rays.forEach(({ ray, a }, i) => {
      const p = prog(t, .02, .5);
      const len = oc(p);
      ray.style.opacity = (1 - p) * .95;
      ray.style.transform = `translate(${cx}px,${cy}px) rotate(${a}deg) translateX(${80 + len * 520}px) scaleX(${.2 + (1 - p) * .9})`;
    });
    conf.forEach(o => {
      const tt = Math.max(0, t - .03 - o.d);
      const dist = o.v * (1 - Math.exp(-tt * 3.2)) / 3.2 * 3;
      const x = cx + Math.cos(o.a) * dist, y = cy + Math.sin(o.a) * dist + 600 * tt * tt;
      o.e.style.opacity = tt > 0 ? clamp(1.5 - tt) : 0;
      o.e.style.transform = `translate(${x}px,${y}px) rotate(${o.rot * tt}deg)`;
    });
  });

  // gold paper-cut blob behind the title
  const blobPts = [];
  { const rr = rng(5); for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, rad = 1 + (rr() - .5) * .18; blobPts.push([500 + Math.cos(a) * 470 * rad, 330 + Math.sin(a) * 300 * rad]); } }
  const blob = svg(1000, 660, `<polygon points="${P(blobPts)}" fill="#0B1F4D" opacity=".82"/>
     <polygon points="${P(blobPts)}" fill="none" stroke="#E9B949" stroke-width="8" stroke-dasharray="26 16"/>`,
    'left:40px;top:830px;transform-origin:500px 330px');

  const grp = el('div', 'abs', 'width:1080px;height:1920px;transform-origin:540px 1150px');
  const l1 = el('div', 'abs anton', 'left:0;width:1080px;top:880px;text-align:center;font-size:250px;color:#fff;letter-spacing:4px', grp);
  const l2 = el('div', 'abs anton', 'left:0;width:1080px;top:1105px;text-align:center;font-size:250px;color:#fff;letter-spacing:4px', grp);
  const sh = 'text-shadow:10px 10px 0 #0B1F4D, 0 0 30px rgba(0,0,0,.25)';
  const L1 = letters(l1, 'MENTAL', sh), L2 = letters(l2, 'HEALTH', sh);
  const r2 = rng(33);
  const rot1 = L1.map(() => (r2() - .5) * 40), rot2 = L2.map(() => (r2() - .5) * 40);

  const label = el('div', 'abs sticker', 'left:290px;top:1380px;width:500px;height:170px;transform-origin:250px 85px', grp);
  const labIn = el('div', 'abs anton', `width:500px;height:170px;background:var(--gold);color:var(--navy);font-size:140px;
     text-align:center;line-height:170px;clip-path:${tornClip(500, 170, 16, 9)}`, label, '@ KPT!');

  const date = el('div', 'abs sticker', 'left:150px;top:1585px;width:780px;height:130px', grp);
  const dateIn = el('div', 'abs bebas', `width:780px;height:130px;background:var(--cream);color:var(--navy);font-size:104px;letter-spacing:6px;
     text-align:center;line-height:140px;clip-path:${tornClip(780, 130, 12, 4)}`, date);
  const DL = letters(dateIn, '15 OKTOBER 2026');

  on(t => {
    const vis = t < 3.0;
    show(grp, vis); show(blob, vis);
    if (!vis) return;
    // blob
    const bp = ob(prog(t, .0, .35), 1.4);
    blob.style.opacity = 1 - prog(t, 2.7, 2.95);
    tf(blob, 0, 0, lerp(.2, 1, bp) * (1 + .02 * Math.sin(t * 6)), lerp(-25, -3, bp));
    // letters: drop in with scale bounce + motion blur
    const anim = (Ls, rots, t0) => Ls.forEach((s, i) => {
      const p = prog(t, t0 + i * .045, t0 + i * .045 + .34);
      const e = ob(p, 2.2);
      s.style.opacity = p > 0 ? clamp(p * 4) : 0;
      s.style.transform = `translateY(${lerp(-300, 0, e)}px) scale(${lerp(1.9, 1, e)}) rotate(${lerp(rots[i], 0, e)}deg)`;
      s.style.filter = `blur(${(1 - clamp(p * 1.6)) * 16}px)`;
    });
    anim(L1, rot1, .06); anim(L2, rot2, .2);
    // "@ KPT!" slam
    const lp = prog(t, .55, .74);
    label.style.opacity = lp > 0 ? 1 : 0;
    tf(label, 0, 0, lerp(3.2, 1, oc(lp)) + .06 * Math.sin(prog(t, .74, 1.1) * Math.PI) * (lp >= 1 ? 1 : 0), lerp(-18, -5, oc(lp)));
    // date strip
    const dp = prog(t, 1.55, 1.85);
    date.style.opacity = dp > 0 ? 1 : 0;
    date.style.clipPath = `inset(0 ${(1 - oc(dp)) * 100}% 0 0)`;
    tf(date, 0, 0, 1, lerp(4, 2, oc(dp)));
    DL.forEach((s, i) => {
      const p = prog(t, 1.62 + i * .03, 1.62 + i * .03 + .25);
      s.style.transform = `translateY(${lerp(60, 0, ob(p))}px)`;
      s.style.opacity = p > 0 ? 1 : 0;
    });
    // subtle breathing and exit
    const ex = ic(prog(t, 2.72, 2.98));
    grp.style.opacity = 1 - ex;
    tf(grp, 0, lerp(0, -90, ex), lerp(1 + .015 * Math.sin(t * 5), .82, ex));
  });
}

// ============================================================================
// 2. BOOTH 3-9
// ============================================================================
rip(3.0, '#0B1F4D', 101, null);
{
  // header sticker "MENTAL HEALTH BOOTH"
  const hd = el('div', 'abs sticker', 'left:70px;top:200px;width:940px;height:190px;transform-origin:470px 95px');
  el('div', 'abs', `width:940px;height:190px;background:#fff;border-radius:26px;clip-path:${tornClip(940, 190, 10, 12)}`, hd);

      const p = prog(t, o.t0, o.t0 + .28), out = ic(prog(t, 23.78, 23.98));
      o.p.style.opacity = 1 - out;
      tf(o.p, lerp(o.dx, 0, oq(p)), lerp(-300, 0, oq(p)) - out * 200, lerp(1.25, 1, oq(p)) * (1 - out * .2), lerp(o.r * 5, o.r, oq(p)) + Math.sin(t * 2 + o.r) * .8);
    });
  });
}

// ============================================================================
// 5. ENDING 24-30
// ============================================================================
{
  // warm light leaks + bottom gradient for type
  const grad = el('div', 'abs full', 'background:linear-gradient(180deg, rgba(0,0,0,0) 52%, rgba(6,14,38,.72) 100%)');
  const leak1 = el('div', 'abs', 'width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle, rgba(255,190,90,.55), rgba(255,140,60,0) 65%);mix-blend-mode:screen');
  const leak2 = el('div', 'abs', 'width:900px;height:900px;border-radius:50%;background:radial-gradient(circle, rgba(255,230,170,.45), rgba(255,200,120,0) 65%);mix-blend-mode:screen');
  on(t => {
    const v = t >= 24.0;
    show(grad, v); show(leak1, v); show(leak2, v);
    if (!v) return;
    const k = prog(t, 24.0, 24.6);
    grad.style.opacity = k;
    leak1.style.opacity = k * (.6 + .3 * Math.sin(t * 1.3));
    leak2.style.opacity = k * (.5 + .3 * Math.cos(t * 1.1));
    tf(leak1, -500 + (t - 24) * 120, -300 + Math.sin(t * .7) * 80);
    tf(leak2, 650 - (t - 24) * 90, 1100 + Math.cos(t * .6) * 120);
  });

  // "Terima Kasih, Kementerian Pendidikan Tinggi!"
  const tk = el('div', 'abs', 'left:0;top:1210px;width:1080px;height:330px');
  const t1 = el('div', 'abs play', 'left:0;top:0;width:1080px;text-align:center;font-size:140px;font-style:italic;font-weight:600;color:var(--gold2);text-shadow:0 6px 24px rgba(0,0,0,.5)', tk, 'Terima Kasih,');
  const line = el('div', 'abs', 'left:340px;top:178px;width:400px;height:4px;background:linear-gradient(90deg,transparent,#E9B949,transparent);transform-origin:50% 50%', tk);
  const t2 = el('div', 'abs mont', 'left:0;top:206px;width:1080px;text-align:center;font-size:50px;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.6)', tk, 'Kementerian Pendidikan Tinggi!');
  on(t => {
    if (!show(tk, t >= 24.35 && t < 26.85)) return;
    const p1 = prog(t, 24.4, 24.95), p2 = prog(t, 24.75, 25.3), out = ioc(prog(t, 26.4, 26.8));
    tk.style.opacity = 1 - out;
    tf(tk, 0, lerp(0, -60, out));
    t1.style.clipPath = `inset(${(1 - oc(p1)) * 100}% 0 0 0)`;
    tf(t1, 0, lerp(40, 0, oc(p1)));
    t1.style.letterSpacing = lerp(14, 1, oc(p1)) + 'px';
    line.style.transform = `scaleX(${oc(prog(t, 24.85, 25.3))})`;
    t2.style.opacity = oc(p2);
    t2.style.letterSpacing = lerp(8, 1.5, oc(p2)) + 'px';
  });

  // closing card over the final clip: name, slogan, gold particles
  const sel = el('div', 'abs full', 'overflow:hidden');
  const sgrad = el('div', 'abs full', 'background:linear-gradient(180deg, rgba(6,14,38,.25) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(6,14,38,.85) 100%)', sel);
  // gold particles
  const parts = [];
  { const r = rng(99); for (let i = 0; i < 70; i++) { const s = 4 + r() * 12; const e = el('div', 'abs', `width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle,#fff6d6,#E9B949 55%,rgba(233,185,73,0) 72%);mix-blend-mode:screen`, sel); parts.push({ e, x: r() * 1080, y: 400 + r() * 1700, v: 60 + r() * 160, ph: r() * 6.28, d: r() * 1.2 }); } }
  const nm = el('div', 'abs play', 'left:0;top:1350px;width:1080px;text-align:center;font-size:112px;font-weight:700;color:#fff;text-shadow:0 6px 26px rgba(0,0,0,.55)', sel);
  const NL = letters(nm, 'Dr Fakrul Azren');
  const nline = el('div', 'abs', 'left:290px;top:1486px;width:500px;height:5px;background:linear-gradient(90deg,transparent,#E9B949,transparent)', sel);
  const slog = el('div', 'abs cav', 'left:0;top:1500px;width:1080px;text-align:center;font-size:112px;color:var(--gold2);text-shadow:0 5px 20px rgba(0,0,0,.6)', sel, 'Spread Positivity');
  const sparkL = doodle('spark', 90, '#F7D98B', 'left:150px;top:1515px', 7), sparkR = doodle('spark', 90, '#F7D98B', 'left:840px;top:1515px', 7);
  sel.appendChild(sparkL); sel.appendChild(sparkR);
  const fade = el('div', 'abs full', 'background:#000;opacity:0');
  on(t => {
    if (!show(sel, t >= 26.9)) { show(fade, false); return; }
    sel.style.opacity = oc(prog(t, 26.9, 27.3));
    parts.forEach(o => {
      const tt = t - 26.5 - o.d;
      o.e.style.opacity = tt > 0 ? clamp(tt * 2) * (.5 + .5 * Math.sin(t * 5 + o.ph)) : 0;
      o.e.style.transform = `translate(${o.x + Math.sin(t * 1.5 + o.ph) * 30}px,${o.y - Math.max(0, tt) * o.v}px)`;
    });
    NL.forEach((s, i) => {
      const p = prog(t, 27.25 + i * .035, 27.25 + i * .035 + .4);
      s.style.opacity = oc(p); s.style.transform = `translateY(${lerp(40, 0, oc(p))}px)`;
      s.style.filter = `blur(${(1 - oc(p)) * 8}px)`;
    });
    nline.style.transform = `scaleX(${oc(prog(t, 27.7, 28.2))})`;
    slog.style.clipPath = `inset(0 ${(1 - ioc(prog(t, 27.85, 28.5))) * 100}% 0 0)`;
    [sparkL, sparkR].forEach((d, i) => {
      const a = 28.4 + i * .1;
      d.path.setAttribute('stroke-dashoffset', 1 - oc(prog(t, a, a + .3)));
      tf(d, 0, 0, 1 + .08 * Math.sin(t * 6 + i));
    });
    show(fade, t >= 29.2);
    fade.style.opacity = ioc(prog(t, 29.2, 30.0));
  });
}

// ---------- API ---------------------------------------------------------------
window.seek = t => { for (const f of C) f(t); };
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  window.seek(0);
  return true;
})();
